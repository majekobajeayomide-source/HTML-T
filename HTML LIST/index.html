<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML LIST</title>
</head>
<body>
    <!-- ordered list -->
    <ol type="a">
        <li>Rice</li>
        <li>indomie</li>
        <li>sphaggetti</li>
        <li>beans</li>
        <li>garri</li>
        <li>yam</li>
    </ol>

    <!-- unordered list -->
     <ul>
        <li>Eggs</li>
        <li>Plantain</li>
        <li>Biscuit</li>
    </ul>

    <!-- Descriptive List -->
     <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
     </dl>


</body>
</html>
